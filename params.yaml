# All thresholds and hyperparameters live here; DVC tracks each section as stage params.

batches:
  seed: 42
  held_out_genres: 10   # how many genres to keep out of the base set, or an explicit list
  base_fraction: 0.8    # share of in-distribution tracks that go into the base set
  batch_size: 2000
  n_normal: 3
  n_drifted: 2
  n_shifted: 2
  corrupt_fraction: 0.02
  drift:                # additive shift for "drifted" batches (stand-in for an era shift)
    energy: 0.15
    loudness: 3.0
    acousticness: -0.15

validate:
  max_reject_rate: 0.05   # hard failure: a source file with more rejected rows than this stops the pipeline
  ranges:                 # [min, max], both inclusive
    popularity: [0, 100]
    duration_ms: [1000, 7200000]   # 1 s to 2 h; the shortest real track is 8.6 s
    danceability: [0, 1]
    energy: [0, 1]
    key: [-1, 11]                  # pitch class; -1 means no key detected
    loudness: [-60, 5]             # dB
    mode: [0, 1]                   # 0 minor, 1 major
    speechiness: [0, 1]
    acousticness: [0, 1]
    instrumentalness: [0, 1]
    liveness: [0, 1]
    valence: [0, 1]
    tempo: [0, 250]                # BPM; 0 is allowed (silent tracks) but counted as a warning
    time_signature: [0, 7]

features:
  columns:                # scaled into z_<column>; the recommender picks from these
    - danceability
    - energy
    - loudness
    - speechiness
    - acousticness
    - instrumentalness
    - liveness
    - valence
    - tempo
    - mode
    - key_sin
    - key_cos
  reference_rows: 10000   # size of the drift-check reference sample
  seed: 42
