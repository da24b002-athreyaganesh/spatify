# All thresholds and hyperparameters live here; DVC tracks each section as stage params.

batches:
  seed: 42
  held_out_genres: 10   # how many genres to keep out of the base set, or an explicit list
  base_fraction: 0.8    # share of in-distribution tracks that go into the base set
  batch_size: 2000
  n_normal: 3
  n_drifted: 2
  n_shifted: 2
  corrupt_fraction: 0.02
  drift:                # additive shift for "drifted" batches (stand-in for an era shift)
    energy: 0.15
    loudness: 3.0
    acousticness: -0.15

validate:
  max_reject_rate: 0.05   # hard failure: a source file with more rejected rows than this stops the pipeline
  ranges:                 # [min, max], both inclusive
    popularity: [0, 100]
    duration_ms: [1000, 7200000]   # 1 s to 2 h; the shortest real track is 8.6 s
    danceability: [0, 1]
    energy: [0, 1]
    key: [-1, 11]                  # pitch class; -1 means no key detected
    loudness: [-60, 5]             # dB
    mode: [0, 1]                   # 0 minor, 1 major
    speechiness: [0, 1]
    acousticness: [0, 1]
    instrumentalness: [0, 1]
    liveness: [0, 1]
    valence: [0, 1]
    tempo: [0, 250]                # BPM; 0 is allowed (silent tracks) but counted as a warning
    time_signature: [0, 7]

features:
  columns:                # scaled into z_<column>; the recommender picks from these
    - danceability
    - energy
    - loudness
    - speechiness
    - acousticness
    - instrumentalness
    - liveness
    - valence
    - tempo
    - mode
    - key_sin
    - key_cos
  reference_rows: 10000   # size of the drift-check reference sample
  seed: 42

split:                    # held-out evaluation tracks, picked by a hash of track_id, so a
  seed: 42                # track stays on the same side as the catalogue grows
  eval_fraction: 0.1      # their genres are never used to fit a model

train:
  k: 10                   # recommendations per query when the caller doesn't say
  feature_sets:           # features dropped from features.columns; each feature set x each
    all: []               # weighting is one candidate model (one nested MLflow run)
    no_tonal: [mode, key_sin, key_cos]
    no_loudness: [loudness]          # loudness moves with energy (r = 0.76 in the EDA)
  weightings: [uniform, fisher]      # fisher: weight features by how well they separate genres

evaluate:
  k: 10
  queries: 2000           # seeded sample of held-out tracks, each used as a seed track
  seed: 42

register:
  model_name: spatify
  min_gain: 0.005         # promote only if genre match@K beats the champion by this much
  min_gain_feedback: 0.01 # ... or, with enough held-out feedback, NDCG@k by this much (D37)

feedback:                 # learning from likes and skips (D37)
  path: data/feedback/feedback.parquet   # the snapshot the worker exports before retraining
  test_fraction: 0.2      # the latest share of lists, held out for hit rate and NDCG
  min_events: 1000        # fewer usable likes and skips than this: no feedback model
  min_test_lists: 30      # fewer held-out lists than this: promote on genre match instead
  k: 3                    # hit rate@k and NDCG@k over each list's rated tracks
  c: 1.0                  # the logistic regression's inverse regularisation strength
  retrain_every: 2000     # the worker retrains after this many new likes and skips

drift:                    # drift_check: each incoming batch against the training data (D35)
  reference: tracks.csv   # the source whose rows are the reference (the base catalogue)
  features: [danceability, energy, loudness, speechiness, acousticness, instrumentalness,
             liveness, valence, tempo]
  bins: 10                # PSI bins, cut at the reference's deciles
  psi_moderate: 0.1       # PSI rule of thumb: < 0.1 stable, 0.1-0.2 moderate, >= 0.2 major
  psi_major: 0.2
  min_moderate: 2         # a batch has drifted: any major feature, or this many moderate ones
