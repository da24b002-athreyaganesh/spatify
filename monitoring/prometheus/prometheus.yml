# Prometheus: scrapes every Spatify service on the Compose network by its service name
# (D40). Adapted from A4, where everything ran with host networking on localhost.
#
# --- AI attribution (course code of conduct, fair use of AI) ------------------------------
# The two regexes under the node job come from A4, generated by Claude Opus 5.5 (Claude
# Code) on 2026-10-17. The rest of this file was written by Claude Opus 5.5 (Claude Code)
# on 2026-11-15; it has no PromQL.
# ------------------------------------------------------------------------------------------
#
# Validate after editing (tests/test_monitoring.py runs the same check):
#   docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
#     --entrypoint promtool prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
# Apply without restarting:  curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 5s       # near real time on the dashboards (they refresh every 10 s)
  scrape_timeout: 4s
  evaluation_interval: 5s   # how often recording and alert rules run
  external_labels:
    project: spatify

rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The REST gateway: requests, latency, model-server calls (as the gateway sees them),
  # feedback-store queries, feedback, like rates, alerts received.
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  # The Streamlit frontend's own metrics server: page views, gateway calls, errors shown.
  - job_name: frontend
    static_configs:
      - targets: ["frontend:9101"]

  # The pipeline worker: runs, stage times and throughput, data drift, pending feedback.
  - job_name: worker
    static_configs:
      - targets: ["worker:9102"]

  # The model server's supervisor: version served, restarts, switch time, memory.
  - job_name: model-server
    static_configs:
      - targets: ["model-server:9103"]

  # MLflow's tracking server (--expose-prometheus): its HTTP requests and latency.
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]

  # The feedback store, through postgres-exporter: up, table rows, database sizes.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    metric_relabel_configs:
      # AI-GENERATED REGEX (from A4): Claude Opus 5.5 (Claude Code), 2026-10-17
      # What it does: drops node_exporter network and disk series for virtual devices
      # (loopback, Docker veth/bridge, snap loop devices, RAM/zram disks), so the dashboard
      # only plots real hardware. Prometheus joins the source label values with ";", e.g.
      # "node_network_receive_bytes_total;veth1a2b", and drops the series if the WHOLE
      # string matches.
      - source_labels: [__name__, device]
        regex: "node_(network|disk)_.+;(lo|veth.*|docker[0-9]+|br-.*|loop[0-9]+|ram[0-9]+|zram[0-9]+)"
        action: drop
      # AI-GENERATED REGEX (from A4): Claude Opus 5.5 (Claude Code), 2026-10-17
      # What it does: drops filesystem series for in-memory filesystems (tmpfs, ramfs) and
      # FUSE mounts, which mean nothing on a disk-space panel. "fuse\\..*" is YAML for the
      # regex fuse\..* (a literal "fuse." followed by anything).
      - source_labels: [__name__, fstype]
        regex: "node_filesystem_.+;(tmpfs|ramfs|fuse\\..*)"
        action: drop

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
