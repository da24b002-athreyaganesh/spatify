# Alert rules (L9), evaluated every 5 s. Prometheus sends firing and resolved alerts to
# Alertmanager, which posts them to the gateway's /alerts; the console shows them (D41).
# States: inactive -> pending (condition true, waiting out `for`) -> firing.
# See them at http://localhost:9090/alerts; tests: monitoring/prometheus/tests/.
#
# --- AI attribution (course code of conduct, fair use of AI) ------------------------------
# Every PromQL expression in this file was generated by Claude Opus 5.5 (Claude Code) on
# 2026-11-15. The comment above each one says what it computes.
# ------------------------------------------------------------------------------------------

groups:
  - name: spatify-service
    rules:
      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: a scrape target
      # Prometheus has failed to scrape for a minute (up is written by Prometheus itself:
      # 1 if the last scrape worked, else 0).
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus hasn't been able to scrape {{ $labels.instance }} for a minute."

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the gateway's blackbox
      # probe of the model server (/ping every 15 s) has failed for a minute, so listeners
      # get no recommendations even if the supervisor process is up.
      - alert: ModelServerUnreachable
        expr: spatify_model_server_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The gateway can't reach the model server"
          description: "No recommendations can be served. Check `docker compose logs model-server`."

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the recorded
      # 95th-percentile /recommend latency (recording.yml) above 300 ms for 2 minutes: the
      # problem statement's "low hundreds of milliseconds at the 95th percentile".
      - alert: RecommendLatencyHigh
        expr: spatify:recommend_latency_seconds:p95_1m > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 /recommend latency above 300 ms"
          description: "The 95th-percentile time to answer /recommend is {{ $value | humanizeDuration }}."

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: more than 5% of gateway
      # requests answered with a 5xx status over 5 minutes, for 2 minutes.
      - alert: GatewayErrorsHigh
        expr: spatify:gateway_error_ratio:rate5m > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of gateway requests are failing"
          description: "{{ $value | humanizePercentage }} of requests got a 5xx answer over the last 5 minutes."

  - name: spatify-data-and-model
    rules:
      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the worker's verdict on
      # the latest batch (D35: any feature at PSI >= 0.2, or two at 0.1-0.2). It stays 1
      # until a batch without drift arrives.
      - alert: DataDrift
        expr: spatify_drift_detected == 1
        labels:
          severity: warning
        annotations:
          summary: "New tracks differ from the training data"
          description: "The latest batch in data/incoming has drifted (PSI); the worker retrains on it. Details: console, Data drift."

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the gateway's feedback
      # drift flag (D37): the like rate of the latest 200 ratings has fallen 15 points or
      # more below the 1,000 before them, for a minute.
      - alert: FeedbackDrift
        expr: spatify_feedback_drift == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Listeners are liking fewer songs"
          description: "The like rate has dropped by 15 points or more. If a model was promoted recently, consider rolling back (console, Models)."

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: at least one pipeline
      # run failed in the last 15 minutes. increase() handles the counter restarting when
      # the worker restarts; sum() adds up the triggers.
      - alert: PipelineRunFailed
        expr: sum(increase(spatify_pipeline_runs_total{status="failed"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A pipeline run failed"
          description: "The champion keeps serving. The run's message in the console (Pipeline, Run history) says why."

  - name: host
    rules:
      # AI-generated PromQL (from A4: Claude Opus 5.5, Claude Code, 2026-10-17). Computes:
      # available memory below 10% of the total for 2 minutes.
      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of the laptop's memory is free"
          description: "Only {{ $value | humanizePercentage }} of RAM is available; stop the stack or close apps before a pipeline run."
