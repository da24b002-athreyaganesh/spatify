# Recording rules (L9): queries the alerts and dashboards share, computed once every
# evaluation_interval and stored as new series named level:metric:operation.
#
# --- AI attribution (course code of conduct, fair use of AI) ------------------------------
# Every PromQL expression in this file was generated by Claude Opus 5.5 (Claude Code) on
# 2026-11-15. The comment above each one says what it computes.
# ------------------------------------------------------------------------------------------

groups:
  - name: spatify-recording
    rules:
      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the 95th-percentile
      # time to answer POST /recommend over the last minute. rate() turns each cumulative
      # bucket into a per-second rate, sum by (le) adds the gateway's processes together,
      # and histogram_quantile interpolates the 0.95 point inside its bucket (so it is an
      # estimate bounded by the bucket edges, one of which is 0.3 s).
      - record: spatify:recommend_latency_seconds:p95_1m
        expr: histogram_quantile(0.95, sum by (le) (rate(spatify_gateway_request_seconds_bucket{endpoint="/recommend"}[1m])))

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: the share of gateway
      # requests answered with a 5xx status over 5 minutes. "> 0" drops the denominator when
      # there was no traffic, so 0/0 gives no value instead of NaN.
      - record: spatify:gateway_error_ratio:rate5m
        expr: |
          sum(rate(spatify_gateway_requests_total{status=~"5.."}[5m]))
            / (sum(rate(spatify_gateway_requests_total[5m])) > 0)

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: requests per second
      # handled by the gateway, per endpoint, over the last minute.
      - record: spatify:gateway_requests:rate1m
        expr: sum by (endpoint) (rate(spatify_gateway_requests_total[1m]))

      # AI-generated PromQL (Claude Opus 5.5, Claude Code). Computes: each model version's
      # like rate over the last 30 minutes: likes / (likes + skips) on lists that version
      # served. A version with skips but no likes yet has no "like" series at all, so
      # "or ... * 0" fills its likes with 0 (a broken model shows 0%, not nothing).
      # Versions without ratings in the window have no value.
      - record: spatify:like_rate:by_version_30m
        expr: |
          (
            sum by (model_version) (increase(spatify_feedback_total{action="like"}[30m]))
              or sum by (model_version) (increase(spatify_feedback_total[30m])) * 0
          )
            / (sum by (model_version) (increase(spatify_feedback_total[30m])) > 0)
