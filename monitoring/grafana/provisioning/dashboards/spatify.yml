# Grafana loads every dashboard in /etc/grafana/dashboards (monitoring/grafana/dashboards
# in the repo) into the "Spatify" folder. They are generated by build_dashboards.py; edit
# that, not the JSON, and not in the Grafana UI (UI changes can't be saved here).
apiVersion: 1

providers:
  - name: spatify
    folder: Spatify
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
