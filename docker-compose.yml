# Spatify stack: Postgres, MLflow, the model server, the gateway, the frontend and the worker.
#
#   docker compose up -d --build        start (secrets come from .env; see .env.example)
#   docker compose ps                   health of each service
#   docker compose logs -f gateway      JSON logs, one line per request
#   docker compose down                 stop (data stays in the named volumes)
#
# Services find each other by service name on the Compose network. Published, on
# localhost only: the web app (8501), the gateway (8000), the MLflow UI (5000) and the
# frontend's and worker's metrics (9101, 9102). Phase 6 adds Prometheus and Grafana.
#
# Memory (D30): every service has a hard limit with no swap, so a runaway service is
# stopped and restarted instead of pushing the laptop into swap. Idle, the stack uses
# about 1.5 GB; the worker adds up to 2 GB while the pipeline runs. `docker stats`
# shows each service's use against its limit.

name: spatify

x-healthcheck: &probe
  interval: 10s
  timeout: 5s
  retries: 5

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spatify
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *probe
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d spatify"]
      interval: 5s

  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    image: spatify/mlflow:latest
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      # MLflow 3's job runner starts 7 background processes (~150 MB each) for GenAI
      # features (scorers, prompt optimisation, trace roll-ups) that Spatify doesn't use.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      # Other containers call it as mlflow:5000; the host as localhost:5000.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      start_period: 30s

  model-server:
    build:
      context: .
      dockerfile: services/model_server/Dockerfile
    image: spatify/model-server:latest
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: spatify
      MODEL_ALIAS: champion
      PORT: "8080"
      # Each worker holds its own copy of the model (~280 MB); one answers in a few ms.
      WORKERS: "1"
      POLL_SECONDS: "10"
    expose:
      - "8080"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping', timeout=4)"]
      start_period: 60s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: spatify/gateway:latest
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MODEL_SERVER_URL: http://model-server:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spatify
      MODEL_NAME: spatify
      API_KEY_SHA256: ${API_KEY_SHA256:?set API_KEY_SHA256 in .env}
      REFRESH_SECONDS: "15"
      # Fail fast instead of retrying for minutes when MLflow is down.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      PIPELINE_DIR: /app/pipeline
    volumes:
      # The console's pipeline view (D34): the DVC pipeline, its last results and the
      # stage metrics, read-only.
      - ./dvc.yaml:/app/pipeline/dvc.yaml:ro
      - ./dvc.lock:/app/pipeline/dvc.lock:ro
      - ./metrics:/app/pipeline/metrics:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      # Only "started": with no champion yet the model server stays unhealthy, and the
      # gateway should still come up and say so on /health (503) rather than not start.
      model-server:
        condition: service_started
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    image: spatify/frontend:latest
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      API_BASE_URL: http://gateway:8000  # the frontend's only way to the backend
      METRICS_PORT: "9101"
      # Links the console opens in the operator's browser, so host addresses.
      MLFLOW_UI_URL: http://localhost:5000
      GRAFANA_URL: http://localhost:3000
      PROMETHEUS_URL: http://localhost:9090
      RAY_DASHBOARD_URL: http://localhost:8265
      GATEWAY_DOCS_URL: http://localhost:8000/docs
    ports:
      - "127.0.0.1:8501:8501"
      - "127.0.0.1:9101:9101"
    depends_on:
      # Only "started": the app should come up and explain an unavailable gateway itself.
      gateway:
        condition: service_started
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      # The repo is mounted read-write and belongs to the host user (uid 1000 on this
      # drive); the image runs as a user with the same uid, so the files it writes stay
      # the host user's. Set HOST_UID/HOST_GID in .env if yours differ (`id -u`, `id -g`).
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: spatify/worker:latest
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 3g
    shm_size: 1.5gb  # Ray keeps its 1 GB object store in /dev/shm
    stop_grace_period: 3m  # a stop waits for the pipeline run in progress to finish
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/spatify
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REPO_DIR: /repo
      POLL_SECONDS: "15"
      METRICS_PORT: "9102"
      SPATIFY_RAY_CPUS: "4"
      SPATIFY_RAY_OBJECT_STORE_MB: "1024"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    volumes:
      - ./:/repo
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics', timeout=4)"]
      start_period: 20s

volumes:
  postgres-data:
  mlflow-artifacts:
